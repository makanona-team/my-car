name: decomp
# فكّ كود لانشر المصنع الذي يرفعه «كاشف لانشر المصنع» من الشاشة (للبحث عن إشارة الأضواء)
on:
  workflow_dispatch:
    inputs:
      url:
        description: "رابط ملف factory-code.zip"
        required: true
permissions:
  contents: write
jobs:
  decomp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: تنزيل وفكّ
        run: |
          set -x
          mkdir -p w out && cd w
          U="${{ github.event.inputs.url }}"; case "$U" in http*) ;; *) U="https://$U";; esac
          curl -fsSL "$U" -o first.txt
          # رابط التقرير يحوي سطر «files: <فهرس>»؛ الفهرس يبدأ بـ MYCAR-PARTS
          if ! head -1 first.txt | grep -q MYCAR-PARTS; then IDX=$(grep -o 'files: http[^ ]*' first.txt | head -1 | cut -d' ' -f2); curl -fsSL "$IDX" -o first.txt; cp first.txt ../out/ 2>/dev/null || true; fi
          tail -n +2 first.txt | while read -r u; do [ -n "$u" ] && curl -fsSL --retry 3 "$u"; done > code.b64
          base64 -d code.b64 > code.zip
          curl -fsSL "$U" -o ../out/report.txt || true
          unzip -q code.zip -d src
          curl -fsSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q jadx.zip -d jadx
          for d in src/*/; do
            p=$(basename "$d")
            (cd "$d" && zip -q -r "../../$p.apk" .)
            ./jadx/bin/jadx -q -d "../out/$p" --no-res --show-bad-code "$p.apk" || true
            [ -f "$d/AndroidManifest.xml" ] && ./jadx/bin/jadx -q -d "../out/$p-res" --no-src "$p.apk" || true
          done
          cd ../out && find . -name '*.java' | wc -l
          grep -rniE "ill|light|lamp|night|TWUtil|sendBroadcast|registerReceiver|bindService" --include=*.java . | grep -viE "highlight|lighter|delight" | head -3000 > ../hits.txt || true
          mv ../hits.txt .
      - name: حفظ في فرع decomp
        run: |
          cd out
          git init -q -b decomp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "decomp" && git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" decomp
